<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizador — Requisições de Rede Interna</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #2a9d8f; --teal-dark: #1f7a6e; --teal-light: #e8f5f3; --teal-mid: #c5e8e4;
    --gray-50: #f8fafb; --gray-200: #e2eaeb; --gray-400: #94a3ab;
    --gray-600: #4a6068; --gray-800: #1e2d32; --white: #ffffff;
    --radius: 8px; --radius-sm: 5px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--gray-50); display: flex; height: 100vh; overflow: hidden; }

  /* SIDEBAR LISTA */
  .sidebar { width: 300px; min-width: 300px; background: var(--white); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; height: 100vh; }
  .sidebar-top { background: var(--teal); padding: 14px 16px; }
  .sidebar-top h1 { color: white; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .sidebar-top p { color: rgba(255,255,255,.8); font-size: 11px; }
  .search-wrap { padding: 10px 12px; border-bottom: 1px solid var(--gray-200); }
  .search-wrap input { width: 100%; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); padding: 7px 10px; font-size: 12px; font-family: 'DM Sans', sans-serif; outline: none; color: var(--gray-800); background: var(--gray-50); }
  .search-wrap input:focus { border-color: var(--teal); background: white; }
  .lista-wrap { flex: 1; overflow-y: auto; }
  .item { padding: 11px 14px; border-bottom: 1px solid var(--gray-200); cursor: pointer; transition: background .15s; }
  .item:hover { background: #f0f9f8; }
  .item.ativo { background: var(--teal-light); border-left: 3px solid var(--teal); }
  .item-nome { font-size: 13px; font-weight: 500; color: var(--gray-800); margin-bottom: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item-info { font-size: 11px; color: var(--gray-400); }
  .badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
  .badge-cad { background: var(--teal-light); color: var(--teal-dark); }
  .badge-alt { background: #fef3c7; color: #92400e; }
  .badge-exc { background: #fee2e2; color: #991b1b; }
  .vazio { padding: 30px; text-align: center; color: var(--gray-400); font-size: 12px; }
  .loading { padding: 30px; text-align: center; color: var(--gray-400); font-size: 12px; }

  /* MAIN CONTENT */
  .main { flex: 1; overflow-y: auto; padding: 24px; }
  .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; }
  .placeholder-inner { text-align: center; color: var(--gray-400); }
  .placeholder-inner div:first-child { font-size: 48px; margin-bottom: 12px; }
  .placeholder-inner div:last-child { font-size: 14px; }

  /* FORM VIEW */
  .topbar { background: var(--teal); border-radius: var(--radius) var(--radius) 0 0; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-title { color: white; font-size: 15px; font-weight: 600; }
  .topbar-badge { color: rgba(255,255,255,.85); font-size: 11px; background: rgba(255,255,255,.15); padding: 3px 12px; border-radius: 20px; }
  .bar { background: var(--teal-dark); height: 3px; margin-bottom: 18px; }

  .section-card { background: var(--white); border-radius: var(--radius); border: 1.5px solid var(--gray-200); margin-bottom: 16px; overflow: hidden; }
  .section-hd { background: var(--teal); color: white; padding: 9px 16px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .section-body { padding: 16px; }

  .grid { display: grid; gap: 12px; margin-bottom: 12px; }
  .g5 { grid-template-columns: .7fr 2.5fr 1fr 1fr 1fr; }
  .g4a { grid-template-columns: 1fr 1.5fr 2fr 1fr; }
  .g4b { grid-template-columns: 1.5fr 1fr 1fr 1.8fr; }
  .g2 { grid-template-columns: 1fr 2fr; }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 10px; font-weight: 600; color: var(--gray-400); letter-spacing: .06em; text-transform: uppercase; }
  .field-val { border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); padding: 8px 11px; font-size: 12px; color: var(--gray-800); background: var(--gray-50); min-height: 34px; }
  .field-val.filled { background: white; border-color: var(--teal-mid); }

  .email-box { border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); padding: 13px; background: var(--gray-50); display: flex; flex-direction: column; gap: 10px; }
  .email-lbl { font-size: 10px; font-weight: 600; color: var(--gray-400); letter-spacing: .06em; text-transform: uppercase; }
  .cb-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--gray-600); }
  .cb-box { width: 15px; height: 15px; border: 1.5px solid var(--gray-200); border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; background: white; font-size: 10px; flex-shrink: 0; }
  .cb-box.checked { background: var(--teal); border-color: var(--teal); color: white; }

  .sub-title { font-size: 15px; font-weight: 600; color: var(--gray-800); padding: 4px 0 14px; display: flex; align-items: center; gap: 8px; }
  .sub-title::before { content: ''; width: 4px; height: 18px; background: var(--teal); border-radius: 2px; display: inline-block; }

  .sys-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .sys-box { border: 1.5px solid var(--gray-200); border-radius: var(--radius); overflow: hidden; background: white; }
  .sys-hd { background: var(--teal-light); padding: 8px 12px; font-size: 10px; font-weight: 700; color: var(--teal-dark); letter-spacing: .05em; text-transform: uppercase; border-bottom: 1.5px solid var(--teal-mid); }
  .sys-body { padding: 11px; display: flex; flex-direction: column; gap: 9px; }
  .sys-field { display: flex; flex-direction: column; gap: 3px; }
  .sys-label { font-size: 9px; font-weight: 600; color: var(--gray-400); letter-spacing: .06em; text-transform: uppercase; }
  .sys-val { border: 1.5px solid var(--gray-200); border-radius: 4px; padding: 6px 9px; font-size: 11px; color: var(--gray-800); background: var(--gray-50); }
  .sys-val.filled { background: white; border-color: var(--teal-mid); }
  .s2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .footer { background: white; border: 1.5px solid var(--gray-200); border-radius: 0 0 var(--radius) var(--radius); padding: 11px 16px; display: flex; justify-content: space-between; font-size: 11px; color: var(--gray-400); margin-top: -1px; }

  @media (max-width: 1000px) {
    .g5, .g4a, .g4b, .g2 { grid-template-columns: 1fr 1fr; }
    .sys-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 700px) {
    .sidebar { width: 240px; min-width: 240px; }
    .g5, .g4a, .g4b, .g2 { grid-template-columns: 1fr; }
    .sys-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-top">
    <h1>📋 Requisições de Rede</h1>
    <p id="subtitulo">Carregando...</p>
  </div>
  <div class="search-wrap">
    <input type="text" id="busca" placeholder="🔍 Buscar por nome..." oninput="filtrar(this.value)">
  </div>
  <div class="lista-wrap">
    <div class="loading" id="lista">⏳ Buscando requisições...</div>
  </div>
</div>

<div class="main" id="main">
  <div class="placeholder">
    <div class="placeholder-inner">
      <div>📋</div>
      <div>Selecione uma requisição<br>na lista ao lado</div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUe-XM4CcT5c38i_XWBKNvvkhYHGl9As5avSJ2zU7VrsRs87crG-VFBkPupN16vAmq/exec';

let todos = [];
let atual = -1;

function formatarData(val) {
  if (!val) return '';
  // Se for string tipo "Wed Apr 29 2026 00:00:00 GMT-0300..."
  const d = new Date(val);
  if (!isNaN(d.getTime()) && val.toString().length > 10) {
    return d.toLocaleDateString('pt-BR');
  }
  // Se já for formato yyyy-mm-dd
  if (/^\d{4}-\d{2}-\d{2}/.test(val)) {
    const [y,m,dy] = val.split('-');
    return dy.substring(0,2)+'/'+m+'/'+y;
  }
  return val;
}

function v(r, k) {
  const val = (r[k] || '').toString().trim();
  // Campos de data
  const camposData = ['Data de Nascimento','Data de Admissão','Data Envio'];
  if (camposData.includes(k)) return formatarData(val);
  return val;
}
function sim(r, k) { return v(r, k) === 'Sim'; }

function fval(val) {
  const f = val && val.trim();
  return '<div class="field-val'+(f?' filled':'')+'">'+( val||'&nbsp;')+'</div>';
}
function field(label, val) {
  return '<div class="field"><div class="field-label">'+label+'</div>'+fval(val)+'</div>';
}
function cbHtml(checked, label) {
  return '<div class="cb-row"><div class="cb-box'+(checked?' checked':'')+'">'+( checked?'✓':'')+'</div><span>'+label+'</span></div>';
}
function sysField(label, val) {
  const f = val && val.trim();
  return '<div class="sys-field"><div class="sys-label">'+label+'</div><div class="sys-val'+(f?' filled':'')+'">'+( val||'&nbsp;')+'</div></div>';
}

function renderForm(r) {
  let html = '';
  html += '<div class="topbar"><span class="topbar-title">🌐 Requisição de Rede Interna</span><span class="topbar-badge">TI · Acesso Corporativo</span></div>';
  html += '<div class="bar"></div>';

  // DADOS DO COLABORADOR
  html += '<div class="section-card"><div class="section-hd">Formulário — Dados do Colaborador</div><div class="section-body">';
  html += '<div class="grid g5">';
  html += field('Matrícula', v(r,'Matrícula'));
  html += field('Nome Completo', v(r,'Nome'));
  html += field('Data de Nascimento', v(r,'Data de Nascimento'));
  html += field('CPF', v(r,'CPF'));
  html += field('Empresa', v(r,'Empresa'));
  html += '</div>';
  html += '<div class="grid g4a">';
  html += field('Data de Admissão', v(r,'Data de Admissão'));
  html += field('Cargo', v(r,'Cargo'));
  html += field('Área', v(r,'Área'));
  html += field('Tipo de Requisição', v(r,'Tipo de Requisição'));
  html += '</div>';
  html += '<div class="grid g4b">';
  html += field('Solicitante', v(r,'Solicitante'));
  html += field('Setor', v(r,'Setor'));
  html += field('Ramal', v(r,'Ramal'));
  html += field('Grupo de Acesso a Internet', v(r,'Grupo de Acesso a Internet'));
  html += '</div>';
  html += '<div class="grid g2">';
  html += '<div class="email-box"><div class="email-lbl">Email</div>';
  html += cbHtml(sim(r,'Email'), 'Sim — criar e-mail corporativo');
  if (sim(r,'Email')) html += sysField('Igualar E-mail de', v(r,'Igualar Email'));
  html += '</div>';
  html += field('Observações', v(r,'Observações'));
  html += '</div>';
  html += '</div></div>';

  // ACESSO A SISTEMAS
  html += '<div class="sub-title">Acesso a Sistemas</div>';

  // Row 1
  html += '<div class="sys-grid">';
  html += '<div class="sys-box"><div class="sys-hd">TOTVS12/GPS</div><div class="sys-body">';
  html += cbHtml(sim(r,'TOTVS12/GPS'), 'Sim');
  if (sim(r,'TOTVS12/GPS')) {
    html += sysField('Igualar Perfil TOTVS12/GPS', v(r,'Igualar Perfil TOTVS12/GPS'));
    html += '<div class="s2"><div><div class="sys-label" style="margin-bottom:4px">Manutenção de Guias</div>'+cbHtml(sim(r,'Manutenção de Guias'),'Sim')+'</div>';
    html += '<div><div class="sys-label" style="margin-bottom:4px">Manutenção de Ocorrências</div>'+cbHtml(sim(r,'Manutenção de Ocorrências'),'Sim')+'</div></div>';
  }
  html += '</div></div>';
  html += '<div class="sys-box"><div class="sys-hd">MV</div><div class="sys-body">';
  html += cbHtml(sim(r,'MV'), 'Sim');
  if (sim(r,'MV')) html += sysField('Igualar Perfil MV', v(r,'Igualar Perfil MV'));
  html += '</div></div>';
  html += '<div class="sys-box"><div class="sys-hd">Autorizador Web</div><div class="sys-body">';
  html += cbHtml(sim(r,'Autorizador Web'), 'Sim');
  if (sim(r,'Autorizador Web')) html += sysField('Igualar Perfil Autorizador Web', v(r,'Igualar Perfil Autorizador Web'));
  html += '</div></div></div>';

  // Row 2
  html += '<div class="sys-grid">';
  html += '<div class="sys-box"><div class="sys-hd">Igualar Sistemas Estratégicos</div><div class="sys-body">'+sysField('Usuário referência', v(r,'Igualar Sistemas Estratégicos'))+'</div></div>';
  html += '<div class="sys-box"><div class="sys-hd">Matrix</div><div class="sys-body">';
  html += cbHtml(sim(r,'Matrix'), 'Sim');
  if (sim(r,'Matrix')) html += sysField('Igualar Perfil Matrix', v(r,'Igualar Perfil Matrix'));
  html += '</div></div>';
  html += '<div class="sys-box"><div class="sys-hd">IDCE/MCOCKPIT</div><div class="sys-body">';
  html += cbHtml(sim(r,'IDCE/MCOCKPIT'), 'Sim');
  if (sim(r,'IDCE/MCOCKPIT')) html += sysField('Igualar Perfil IDCE/MCOCKPIT', v(r,'Igualar Perfil IDCE/MCOCKPIT'));
  html += '</div></div></div>';

  // Row 3
  html += '<div class="sys-grid">';
  html += '<div class="sys-box"><div class="sys-hd">Portal & Acesso a Pastas</div><div class="sys-body">';
  html += sysField('Igualar Perfil Portal', v(r,'Igualar Perfil Portal'));
  html += sysField('Igualar Acesso a Pastas', v(r,'Igualar Acesso a Pastas'));
  html += '</div></div>';
  html += '<div class="sys-box"><div class="sys-hd">GREEN</div><div class="sys-body">';
  html += cbHtml(sim(r,'GREEN'), 'Sim');
  if (sim(r,'GREEN')) html += sysField('Igualar Perfil GREEN', v(r,'Igualar Perfil GREEN'));
  html += '</div></div>';
  html += '<div class="sys-box"><div class="sys-hd">NEOH</div><div class="sys-body">';
  html += cbHtml(sim(r,'NEOH'), 'Sim');
  if (sim(r,'NEOH')) html += sysField('Igualar Perfil NEOH', v(r,'Igualar Perfil NEOH'));
  html += '</div></div></div>';

  // Row 4
  html += '<div class="sys-grid">';
  html += '<div class="sys-box"><div class="sys-hd">Sênior</div><div class="sys-body">';
  html += '<div style="font-size:10px;color:var(--gray-400);margin-bottom:4px">Exclusivo Ger. Desenv. Pessoas e Gestão de Pessoas</div>';
  html += cbHtml(sim(r,'Sênior'), 'Sim');
  if (sim(r,'Sênior')) html += sysField('Igualar Perfil Sênior', v(r,'Igualar Perfil Sênior'));
  html += '</div></div>';
  html += '<div class="sys-box"><div class="sys-hd">Blip</div><div class="sys-body">';
  html += cbHtml(sim(r,'Blip'), 'Sim');
  if (sim(r,'Blip')) html += sysField('Igualar Perfil Blip', v(r,'Igualar Perfil Blip'));
  html += '</div></div>';
  html += '<div></div></div>';

  // FOOTER
  html += '<div class="footer"><span>Enviado em '+v(r,'Data Envio')+'</span><span>Requisição de Rede Interna — TI</span></div>';

  return html;
}

function renderLista(lista) {
  const el = document.getElementById('lista');
  document.getElementById('subtitulo').textContent = lista.length + ' requisição(ões)';
  if (!lista.length) { el.innerHTML = '<div class="vazio">Nenhuma requisição encontrada.</div>'; return; }
  el.innerHTML = lista.map((r, i) => {
    const tipo = v(r, 'Tipo de Requisição');
    const bc = tipo==='CADASTRO'?'badge-cad':tipo==='ALTERAÇÃO'?'badge-alt':'badge-exc';
    return '<div class="item" onclick="selecionar('+i+')" id="item-'+i+'">'
      +'<div class="item-nome">'+(v(r,'Nome')||'Sem nome')+(tipo?'<span class="badge '+bc+'">'+tipo+'</span>':'')+'</div>'
      +'<div class="item-info">'+(v(r,'Data Envio')||v(r,'Data de Admissão'))+'</div>'
      +'</div>';
  }).join('');
}

function selecionar(i) {
  atual = i;
  document.querySelectorAll('.item').forEach((el,j) => el.classList.toggle('ativo', j===i));
  document.getElementById('main').innerHTML = renderForm(todos[i]);
}

function filtrar(q) {
  const filtrados = todos.filter(r => (v(r,'Nome')+v(r,'Matrícula')+v(r,'Setor')).toLowerCase().includes(q.toLowerCase()));
  renderLista(filtrados);
}

// Carrega dados via fetch do Apps Script
async function carregar() {
  try {
    const res = await fetch(SCRIPT_URL + '?action=listar');
    const data = await res.json();
    if (data && data.length) {
      todos = data;
      renderLista(todos);
      selecionar(0);
    } else {
      document.getElementById('subtitulo').textContent = 'Sem dados';
      document.getElementById('lista').innerHTML = '<div class="vazio">Nenhuma requisição ainda.</div>';
    }
  } catch(e) {
    document.getElementById('subtitulo').textContent = 'Erro ao carregar';
    document.getElementById('lista').innerHTML = '<div class="vazio">Não foi possível carregar. Verifique a URL do Apps Script.</div>';
  }
}
carregar();
</script>
</body>
</html>
